<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رمشة بلس | اشتراكات وخدمات رقمية</title>

<meta name="description" content="رمشة بلس - اشتراكات وخدمات رقمية، PlayStation Plus، Fortnite وخدمات إلكترونية بأسعار مميزة.">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box
}

:root{
--bg:#050308;
--card:#0d0815;
--purple:#a855f7;
--purple2:#7e22ce;
--light:#e9d5ff;
--muted:#9b92a5;
--border:rgba(168,85,247,.16);
--green:#22c55e;
--yellow:#ffd400;
}

html{
scroll-behavior:smooth
}

body{
background:
radial-gradient(circle at 50% -10%,rgba(126,34,206,.20),transparent 35%),
radial-gradient(circle at 0% 40%,rgba(168,85,247,.07),transparent 25%),
var(--bg);
color:#fff;
font-family:Tahoma,Arial,sans-serif;
min-height:100vh
}

a{
color:inherit;
text-decoration:none
}

button{
font-family:inherit
}

.container{
width:min(100% - 28px,1050px);
margin:auto
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(5,3,8,.78);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,.05)
}

.nav{
height:82px;
display:flex;
align-items:center;
justify-content:space-between;
gap:18px
}

.brand{
display:flex;
align-items:center;
gap:10px
}

.brand img{
width:58px;
height:58px;
object-fit:contain;
filter:drop-shadow(0 0 14px rgba(168,85,247,.45))
}

.brand-text{
display:flex;
flex-direction:column;
gap:3px
}

.brand-text strong{
font-size:17px;
color:#f3e8ff
}

.brand-text span{
font-size:9px;
color:#8e8497
}

.nav-actions{
display:flex;
align-items:center;
gap:8px
}

.nav-btn{
height:42px;
padding:0 14px;
border-radius:13px;
border:1px solid rgba(168,85,247,.20);
background:rgba(255,255,255,.025);
color:#ddd6e5;
cursor:pointer;
transition:.25s
}

.nav-btn:hover{
border-color:rgba(168,85,247,.6);
background:rgba(126,34,206,.12)
}

.nav-btn.primary{
background:linear-gradient(135deg,#7e22ce,#a855f7);
border-color:#a855f7;
color:white;
box-shadow:0 8px 25px rgba(126,34,206,.22)
}

/* HERO */

.hero{
position:relative;
overflow:hidden;
padding:75px 0 55px
}

.hero::before{
content:"";
position:absolute;
width:400px;
height:400px;
border-radius:50%;
background:rgba(126,34,206,.14);
filter:blur(100px);
top:-180px;
right:50%;
transform:translateX(50%);
pointer-events:none
}

.hero-content{
position:relative;
text-align:center
}

.hero-logo{
width:180px;
max-width:70%;
height:auto;
object-fit:contain;
filter:
drop-shadow(0 0 15px rgba(168,85,247,.45))
drop-shadow(0 0 45px rgba(126,34,206,.20));
margin-bottom:24px
}

.badge{
display:inline-flex;
align-items:center;
gap:7px;
padding:8px 13px;
border-radius:50px;
background:rgba(168,85,247,.08);
border:1px solid rgba(168,85,247,.18);
color:#d8b4fe;
font-size:11px;
margin-bottom:18px
}

.badge-dot{
width:7px;
height:7px;
border-radius:50%;
background:#22c55e;
box-shadow:0 0 10px #22c55e
}

.hero h1{
font-size:clamp(30px,6vw,56px);
line-height:1.15;
margin-bottom:15px;
background:linear-gradient(90deg,#fff,#e9d5ff,#a855f7);
-webkit-background-clip:text;
background-clip:text;
color:transparent
}

.hero h1 span{
display:block
}

.hero p{
max-width:620px;
margin:auto;
color:#a59bad;
font-size:14px;
line-height:2
}

.hero-buttons{
display:flex;
justify-content:center;
gap:10px;
margin-top:28px;
flex-wrap:wrap
}

.hero-btn{
min-width:150px;
padding:13px 20px;
border-radius:14px;
font-size:12px;
font-weight:bold;
transition:.25s;
cursor:pointer
}

.hero-btn.main{
background:linear-gradient(135deg,#7e22ce,#a855f7);
border:1px solid #a855f7;
color:#fff;
box-shadow:0 10px 35px rgba(126,34,206,.25)
}

.hero-btn.secondary{
background:rgba(255,255,255,.025);
border:1px solid rgba(255,255,255,.09);
color:#ddd6e5
}

.hero-btn:hover{
transform:translateY(-2px)
}

/* TRUST */

.trust-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin:25px 0 60px
}

.trust-card{
padding:17px 10px;
text-align:center;
background:rgba(255,255,255,.018);
border:1px solid rgba(255,255,255,.055);
border-radius:18px
}

.trust-icon{
font-size:22px;
margin-bottom:8px
}

.trust-card strong{
display:block;
font-size:12px;
margin-bottom:4px
}

.trust-card span{
color:#827989;
font-size:9px
}

/* SECTIONS */

.section{
padding:25px 0 65px
}

.section-heading{
text-align:center;
margin-bottom:25px
}

.section-heading .small{
color:#a855f7;
font-size:10px;
font-weight:bold;
margin-bottom:8px
}

.section-heading h2{
font-size:25px;
margin-bottom:8px
}

.section-heading p{
color:#817887;
font-size:11px
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:13px
}

.product{
position:relative;
overflow:hidden;
background:
linear-gradient(
145deg,
rgba(255,255,255,.035),
rgba(255,255,255,.012)
);
border:1px solid var(--border);
border-radius:22px;
padding:20px 14px;
transition:.3s
}

.product::before{
content:"";
position:absolute;
width:100px;
height:100px;
border-radius:50%;
background:rgba(168,85,247,.10);
filter:blur(35px);
top:-50px;
right:-40px
}

.product:hover{
transform:translateY(-5px);
border-color:rgba(168,85,247,.48);
box-shadow:0 20px 45px rgba(0,0,0,.30)
}

.product-icon{
width:62px;
height:62px;
margin-bottom:15px;
display:flex;
align-items:center;
justify-content:center;
border-radius:17px;
background:#160d22;
border:1px solid rgba(168,85,247,.16);
font-size:24px;
font-weight:bold
}

.netflix{
color:#e50914
}

.shahid{
color:#00d878;
font-size:14px
}

.sports{
color:#00bfff;
font-size:12px
}

.osn{
color:#fff;
background:linear-gradient(135deg,#111827,#312e81)
}

.snap{
background:#050505
}

.tiktok{
color:#fff
}

.instagram{
background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)
}

.x{
background:#000;
color:#fff
}

.product h3{
font-size:13px;
margin-bottom:7px
}

.product p,
.product-description{
color:#817887;
font-size:9px;
line-height:1.8;
min-height:32px;
margin-bottom:15px
}

.order{
display:block;
width:100%;
padding:10px;
text-align:center;
border-radius:12px;
border:1px solid rgba(168,85,247,.25);
background:rgba(126,34,206,.07);
color:#d8b4fe;
font-size:10px;
font-weight:bold;
transition:.25s;
cursor:pointer
}

.order:hover{
background:linear-gradient(135deg,#7e22ce,#a855f7);
color:#fff
}

/* GAMING */

.gaming-box{
position:relative;
overflow:hidden;
padding:35px 22px;
background:
radial-gradient(circle at 50% 0%,rgba(168,85,247,.18),transparent 45%),
radial-gradient(circle at 100% 100%,rgba(255,212,0,.05),transparent 35%),
#09060d;
border:1px solid rgba(168,85,247,.20);
border-radius:28px
}

.gaming-box::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
135deg,
transparent 30%,
rgba(168,85,247,.025),
transparent 70%
);
pointer-events:none
}

.gaming-header{
position:relative;
text-align:center;
margin-bottom:28px
}

.gaming-logo{
font-size:42px;
margin-bottom:8px;
filter:drop-shadow(0 0 18px rgba(168,85,247,.35))
}

.gaming-header h2{
font-size:25px;
margin-bottom:8px
}

.gaming-header p{
color:#83798c;
font-size:10px;
line-height:1.9
}

.gaming-grid{
position:relative;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px
}

.gaming-card{
position:relative;
overflow:hidden;
padding:20px 14px;
background:rgba(255,255,255,.018);
border:1px solid rgba(255,255,255,.06);
border-radius:21px;
transition:.3s
}

.gaming-card:hover{
transform:translateY(-4px);
border-color:rgba(168,85,247,.4);
box-shadow:0 20px 45px rgba(0,0,0,.3)
}

.gaming-card.psplus{
border-color:rgba(255,212,0,.16)
}

.gaming-card.fortnite{
border-color:rgba(168,85,247,.18)
}

.gaming-card h3{
font-size:13px;
margin-bottom:8px
}

.gaming-card p{
color:#817887;
font-size:9px;
line-height:1.9;
margin-bottom:15px
}

.gaming-icon{
width:68px;
height:68px;
border-radius:18px;
margin-bottom:15px;
display:flex;
align-items:center;
justify-content:center;
background:#08080a;
border:1px solid rgba(255,255,255,.08);
overflow:hidden
}

/* OFFICIAL PS PLUS IMAGE */

.ps-plus-logo{
width:54px;
height:54px;
object-fit:contain;
display:block;
filter:drop-shadow(0 0 8px rgba(255,212,0,.20))
}

.psplus .gaming-icon{
background:
linear-gradient(
145deg,
#151515,
#080808
);
border-color:rgba(255,212,0,.35);
box-shadow:
inset 0 0 25px rgba(255,212,0,.04),
0 0 18px rgba(255,212,0,.05)
}

/* FORTNITE */

.fortnite-icon{
font-size:34px;
filter:drop-shadow(0 0 10px rgba(168,85,247,.35))
}

.gaming-price{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
margin-bottom:12px
}

.price{
font-size:17px;
font-weight:bold;
color:#fff
}

.price span{
font-size:9px;
color:#83798c;
font-weight:normal
}

.gaming-tag{
display:inline-block;
padding:5px 8px;
border-radius:8px;
font-size:8px;
background:rgba(168,85,247,.08);
border:1px solid rgba(168,85,247,.16);
color:#c084fc
}

.psplus .gaming-tag{
color:#ffe55c;
background:rgba(255,212,0,.06);
border-color:rgba(255,212,0,.15)
}

/* PLUS PRODUCTS */

.plus-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px
}

.plus-card{
position:relative;
overflow:hidden;
padding:22px 15px;
background:
linear-gradient(
145deg,
rgba(255,255,255,.035),
rgba(255,255,255,.012)
);
border:1px solid rgba(255,212,0,.14);
border-radius:22px;
transition:.3s
}

.plus-card:hover{
transform:translateY(-5px);
border-color:rgba(255,212,0,.42);
box-shadow:0 20px 45px rgba(0,0,0,.35)
}

.plus-card::before{
content:"";
position:absolute;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,212,0,.05);
filter:blur(40px);
top:-70px;
right:-40px
}

.plus-icon{
width:70px;
height:70px;
display:flex;
align-items:center;
justify-content:center;
border-radius:19px;
background:#080808;
border:1px solid rgba(255,212,0,.28);
margin-bottom:15px
}

.plus-icon img{
width:55px;
height:55px;
object-fit:contain;
filter:drop-shadow(0 0 8px rgba(255,212,0,.15))
}

.plus-card h3{
font-size:14px;
margin-bottom:6px
}

.plus-card .duration{
color:#817887;
font-size:9px;
margin-bottom:13px
}

.plus-price{
font-size:20px;
font-weight:bold;
color:#fff;
margin-bottom:14px
}

.plus-pr
